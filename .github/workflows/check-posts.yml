name: Check post anatomy

# Every post follows the one anatomy in .claude/CLAUDE.md; this keeps a new post,
# or an edit to an old one, from drifting off it. Standard library only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_posts.py
